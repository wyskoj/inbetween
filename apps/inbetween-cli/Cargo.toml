[package]
name = "inbetween-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Headless Inbetween: render, inspect and drive projects from the command line."

[[bin]]
name = "ib"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
inbetween-engine = { path = "../../crates/engine" }
inbetween-mcp = { path = "../../crates/mcp" }
serde = "1"
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "tga"] }
inbetween-codecs = { path = "../../crates/codecs" }
inbetween-doc = { path = "../../crates/doc" }
inbetween-format = { path = "../../crates/format" }
inbetween-geom = { path = "../../crates/geom" }
inbetween-raster = { path = "../../crates/raster" }
inbetween-testkit = { path = "../../crates/testkit" }

[lints]
workspace = true
