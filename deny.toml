# Permissive licences only (AGENTS.md rule 8).
[graph]
all-features = true
# Dev-dependencies (test harnesses) never ship, so they are not held to the shipping policy.
exclude-dev = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # Boost Software License: permissive, comparable to MIT. Used by the clipboard crates.
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates are unpublished path dependencies, so they carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Known vulnerabilities in anything we build always fail. "Unmaintained" notices are only fatal
# for crates we depend on directly; for transitive ones they are reported but do not block
# (egui, wgpu and rfd pull in several, and we cannot replace them ourselves).
unmaintained = "workspace"