name: Fuzz

on:
  pull_request:
    paths:
      - "crates/format/**"
      - "crates/doc/**"
      - "crates/geom/**"
      - "fuzz/**"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [project, dots]
    env:
      # A few minutes on pull requests, longer on the weekly run.
      SECONDS_TO_FUZZ: ${{ github.event_name == 'schedule' && 900 || 180 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }}
        run: >
          cargo fuzz run ${{ matrix.target }} fuzz/seeds/${{ matrix.target }}
          -- -max_total_time=${{ env.SECONDS_TO_FUZZ }}
      - name: upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
