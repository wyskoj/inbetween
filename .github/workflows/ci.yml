name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # No GPU on the hosted runners, so Linux uses lavapipe (software Vulkan) and the GPU
      # tests must run there. On Windows and macOS they skip when no adapter exists.
      - name: software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: test
        run: cargo test --workspace
        env:
          INBETWEEN_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '0' }}
          WGPU_BACKEND: ${{ runner.os == 'Linux' && 'vulkan' || '' }}
      - name: layers
        run: cargo xtask layers
      - name: wasm
        run: cargo xtask wasm

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
